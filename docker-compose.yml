version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    networks:
      - rag-network

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    networks:
      - rag-network

  rag:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
